name: SD card release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  sd-card:
    runs-on: ubuntu-latest
    steps:
      # act already mounts this repository, including the ui toolkit.
      # Checking out again would replace that tree with GitHub's copy.
      - uses: actions/checkout@v4
        if: github.actor != 'nektos/act'
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # act's cleanup runs `node` without the tool-cache directory on PATH.
      - name: Put node on the default PATH
        if: github.actor == 'nektos/act'
        run: |
          node_bin=$(find /opt/acttoolcache/node -type f -name node | head -n 1)
          if [ -z "$node_bin" ]; then
            echo "node is missing from the act tool cache" >&2
            exit 1
          fi
          ln -sfn "$node_bin" /usr/bin/node

      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$'; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta" >&2
            exit 1
          fi

      - name: Stop if this release already exists
        if: github.actor != 'nektos/act'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

      - name: Build
        run: make

      - name: Assemble the card tree
        run: |
          rm -rf dist/mpc-boot-thingy-sd
          mkdir -p dist/mpc-boot-thingy-sd
          # Bash stays on the card. --tools would add vim, nano, and busybox-full.
          ./setup.sh --SD dist/mpc-boot-thingy-sd

      - name: Check the card tree
        run: |
          card=dist/mpc-boot-thingy-sd
          test -x "$card/autorun/system/mpc-boot-thingy"
          test -x "$card/autorun/system/mpc-boot-web"
          file "$card/autorun/system/mpc-boot-thingy" | grep -q aarch64
          file "$card/autorun/system/mpc-boot-web" | grep -q aarch64
          test -s "$card/autorun/os_tools/bin/bash"
          test ! -e "$card/autorun/os_tools/bin/vim"
          test ! -e "$card/autorun/os_tools/bin/nano"
          test ! -e "$card/autorun/os_tools/bin/busybox-full"
          test ! -d "$card/os_tools"
          test ! -d "$card/apps"
          test -s "$card/autorun/system/ssh/ssh_host_ed25519_key"
          test -s "$card/autorun/splash-screen.png"
          test -s "$card/autorun/autorun.check"
          test -f "$card/autorun/system/web/index.html"
          test -f "$card/autorun/system/web/xterm.js"
          test -f "$card/autorun/system/web/xterm.css"
          test -f "$card/autorun/system/web/xterm-addon-fit.js"
          test -n "$(find "$card/autorun/system/web/assets" -name '*.js' -print -quit)"
          test -n "$(find "$card/autorun/system/web/assets" -name '*.css' -print -quit)"

      - name: Zip the card tree
        run: |
          python3 - <<'PY'
          import shutil
          import zipfile
          shutil.make_archive(
              "dist/mpc-boot-thingy-sd",
              "zip",
              "dist",
              "mpc-boot-thingy-sd",
          )
          need = [
              "mpc-boot-thingy-sd/autorun/system/mpc-boot-thingy",
              "mpc-boot-thingy-sd/autorun/system/mpc-boot-web",
              "mpc-boot-thingy-sd/autorun/system/web/index.html",
              "mpc-boot-thingy-sd/autorun/system/web/xterm.js",
              "mpc-boot-thingy-sd/autorun/system/web/xterm.css",
              "mpc-boot-thingy-sd/autorun/system/web/xterm-addon-fit.js",
              "mpc-boot-thingy-sd/autorun/system/ssh/ssh_host_ed25519_key",
              "mpc-boot-thingy-sd/autorun/autorun.check",
              "mpc-boot-thingy-sd/autorun/splash-screen.png",
              "mpc-boot-thingy-sd/autorun/os_tools/bin/bash",
          ]
          banned = [
              "mpc-boot-thingy-sd/autorun/os_tools/bin/vim",
              "mpc-boot-thingy-sd/autorun/os_tools/bin/nano",
              "mpc-boot-thingy-sd/autorun/os_tools/bin/busybox-full",
              "mpc-boot-thingy-sd/os_tools/bin/bash",
              "mpc-boot-thingy-sd/apps/",
          ]
          with zipfile.ZipFile("dist/mpc-boot-thingy-sd.zip") as zf:
              names = set(zf.namelist())
          missing = [name for name in need if name not in names]
          if missing:
              raise SystemExit("zip missing: " + ", ".join(missing))
          assets = [name for name in names if name.startswith("mpc-boot-thingy-sd/autorun/system/web/assets/")]
          if not any(name.endswith(".js") for name in assets) or not any(name.endswith(".css") for name in assets):
              raise SystemExit("zip missing the built page assets")
          extra = [name for name in banned if name in names]
          if extra:
              raise SystemExit("zip includes dev tools: " + ", ".join(extra))
          outside = [
              name for name in names
              if name != "mpc-boot-thingy-sd/"
              and not name.startswith("mpc-boot-thingy-sd/autorun/")
          ]
          if outside:
              raise SystemExit("zip has files outside autorun: " + ", ".join(outside))
          PY

      - name: Publish the release
        if: github.actor != 'nektos/act'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/mpc-boot-thingy-sd.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Copy the \`autorun\` folder to the root of your SD card."
