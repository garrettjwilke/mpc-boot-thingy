name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sd-card:
    runs-on: ubuntu-latest
    steps:
      # act already mounts this repository, including the ui toolkit.
      # Checking out again would replace that tree with GitHub's copy.
      - uses: actions/checkout@v4
        if: github.actor != 'nektos/act'
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # act's cleanup runs `node` without the tool-cache directory on PATH.
      - name: Put node on the default PATH
        if: github.actor == 'nektos/act'
        run: |
          node_bin=$(find /opt/acttoolcache/node -type f -name node | head -n 1)
          if [ -z "$node_bin" ]; then
            echo "node is missing from the act tool cache" >&2
            exit 1
          fi
          ln -sfn "$node_bin" /usr/bin/node

      - name: Read and check VERSION
        id: version
        run: |
          python3 - <<'PY'
          import os, re, sys

          with open("VERSION", "r", encoding="utf-8") as fp:
              lines = fp.read().splitlines()

          if not lines:
              sys.exit("VERSION is empty")

          raw = lines[0].strip()
          if raw.startswith("v"):
              raw = raw[1:]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?", raw):
              sys.exit(f"VERSION line 1 must look like 1.2.3 or 1.2.3-beta (got: {lines[0]!r})")

          tag = f"v{raw}"
          notes_lines = lines[1:]
          while notes_lines and not notes_lines[0].strip():
              notes_lines.pop(0)
          while notes_lines and not notes_lines[-1].strip():
              notes_lines.pop()
          notes = "\n".join(notes_lines) if notes_lines else "see the readme for install instructions."

          notes_path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "release-notes.md")
          with open(notes_path, "w", encoding="utf-8") as fp:
              fp.write(notes + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write(f"tag={tag}\n")
              fp.write(f"notes_file={notes_path}\n")

          print(f"Read release tag {tag} from VERSION")
          print("Release notes:\n" + notes)
          PY

      - name: Stop if this release already exists
        if: github.actor != 'nektos/act'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

      - name: Build
        env:
          PACK_VERSION: ${{ steps.version.outputs.tag }}
        run: make

      - name: Check the testapp package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          import zipfile

          zpath = "dist/mpc-boot-thingy.zip"
          need = [
              "manifest.yaml",
              "usb_installer_testapp",
              "autorun/system/mpc-boot-thingy",
              "autorun/system/mpc-boot-web",
              "autorun/system/web/index.html",
              "autorun/system/web/xterm.js",
              "autorun/system/web/xterm.css",
              "autorun/system/web/xterm-addon-fit.js",
              "autorun/system/ssh/ssh_host_ed25519_key",
              "autorun/autorun.check",
              "autorun/autorun.sh",
              "autorun/apps/",
              "autorun/splash-screen.png",
              "autorun/os_tools/bin/bash",
          ]
          banned = [
              "autorun/os_tools/bin/vim",
              "autorun/os_tools/bin/nano",
              "autorun/os_tools/bin/busybox-full",
          ]
          with zipfile.ZipFile(zpath) as zf:
              names = set(zf.namelist())
              missing = [name for name in need if name not in names]
              if missing:
                  raise SystemExit("zip missing: " + ", ".join(missing))
              extra = [name for name in banned if name in names]
              if extra:
                  raise SystemExit("zip includes dev tools: " + ", ".join(extra))
              outside = [
                  name for name in names
                  if name not in ("manifest.yaml", "usb_installer_testapp")
                  and not name.startswith("autorun/")
              ]
              if outside:
                  raise SystemExit("zip has unexpected files: " + ", ".join(outside))
              assets = [name for name in names if name.startswith("autorun/system/web/assets/")]
              if not any(name.endswith(".js") for name in assets) or not any(name.endswith(".css") for name in assets):
                  raise SystemExit("zip missing the built page assets")
              manifest = zf.read("manifest.yaml").decode()
              tag = os.environ["TAG"]
              for line in (
                  'name: "Boot Thingy"',
                  f'version: "{tag}"',
                  'osVersionID: "scarthgap"',
                  '- "AC50"',
                  'relativeExePath: "../usb_installer_testapp"',
              ):
                  if line not in manifest:
                      raise SystemExit("manifest missing " + line)
              def unix_mode(name):
                  info = zf.getinfo(name)
                  if info.create_system != 3:
                      raise SystemExit(name + " is not stored as a Unix mode")
                  return (info.external_attr >> 16) & 0o777
              for name in ("usb_installer_testapp", "autorun/autorun.sh"):
                  mode = unix_mode(name)
                  if mode != 0o755:
                      raise SystemExit(f"{name} mode is {mode:o}, expected 755")
              dest = tempfile.mkdtemp()
              for rel in ("autorun/system/mpc-boot-thingy", "autorun/system/mpc-boot-web"):
                  zf.extract(rel, dest)
                  out = subprocess.check_output(["file", os.path.join(dest, rel)], text=True)
                  if "aarch64" not in out:
                      raise SystemExit(rel + " is not aarch64: " + out.strip())
          PY

      - name: Publish the release
        if: github.actor != 'nektos/act'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/mpc-boot-thingy.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
